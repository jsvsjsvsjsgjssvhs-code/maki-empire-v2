<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماكي الإمبراطورية</title>
<script src="https://jsdelivr.net"></script>
<link href="https://googleapis.com" rel="stylesheet">

<style>
:root{
 --bg:#080609;
 --panel:#120b12;
 --panel2:#1b0c17;
 --red:#b0003a;
 --bright:#ef1b58;
 --pink:#ff7199;
 --line:#492033;
 --white:#f8eaf0;
 --muted:#a994a0;
}
*{box-sizing:border-box;scroll-behavior:smooth}
body{
 margin:0;background:
 radial-gradient(ellipse at 50% 35%,#260b1b 0%,transparent 48%),
 radial-gradient(ellipse at 50% 100%,#200817 0%,transparent 50%),
 var(--bg);
 color:var(--white);font-family:Cairo,sans-serif;
}
button,input,select,textarea{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}

/* الشريط العلوي */
.topbar{
 position:sticky;top:0;z-index:40;
 display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
 gap:10px;padding:12px 24px;
 background:rgba(11,7,13,.94);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);
}
.logo{font-size:21px;font-weight:900;color:var(--white);display:flex;align-items:center;gap:6px}
.logo span{color:var(--pink)}
nav{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
nav a,.nav-button{
 padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;
 background:#190e18;border:1px solid #492033;color:#f3dce6;transition:.2s;
}
nav a:hover,.nav-button:hover{border-color:var(--pink);color:white}
.admin-nav-btn{
 background:linear-gradient(135deg,#c50043,#72001f)!important;
 border-color:#ff5b8d!important;color:white!important;
 box-shadow:0 0 12px #b0003a66;
}

/* البنر الرئيسي */
.hero{padding:0 24px;margin:18px auto 26px;max-width:1200px}
.hero-frame{
 position:relative;min-height:330px;border-radius:16px;overflow:hidden;
 border:1px solid #59263d;
 background:
 linear-gradient(90deg,rgba(8,5,10,.04),rgba(8,5,10,.25) 42%,#0b070d 100%),
 linear-gradient(0deg,#0b070d 0%,transparent 70%),
 radial-gradient(ellipse at 35% 30%,#76213e,#170914 70%);
 background-size:cover;background-position:center 35%;
 box-shadow:0 12px 35px rgba(0,0,0,.65);
}
.hero-frame:after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(90deg,transparent 40%,rgba(8,5,10,.78) 100%);
}
.hero-content{
 position:absolute;z-index:2;right:5%;bottom:28px;
 max-width:430px;
}
.hero-mini{font-size:10px;letter-spacing:4px;color:#ff91b0}
.hero h1{font-size:clamp(25px,5vw,42px);margin:4px 0;color:white}
.hero h1 span{color:var(--pink)}
.hero p{font-size:12px;color:#d8c1cc;margin:5px 0 14px}
.main-btn{
 border:1px solid #e44b79;border-radius:8px;
 padding:9px 15px;background:linear-gradient(135deg,#c50043,#72001f);
 color:white;font-weight:800;font-size:12px;
 box-shadow:0 0 14px #90002e44;
}
.main-btn:hover{filter:brightness(1.2)}
.soft-btn{
 border:1px solid #593044;border-radius:8px;
 padding:8px 12px;background:#1a1019;color:#f3dce6;
 font-size:12px;
}
.soft-btn:hover{border-color:var(--pink);color:white}
.danger-btn{
 border:1px solid #8a1c36;border-radius:8px;
 padding:7px 11px;background:#2b0c15;color:#ff8da6;font-size:11px;
}

main{max-width:1200px;margin:0 auto;padding:0 24px 60px}

/* البحث والتصنيفات */
.search-bar{margin:16px 0}
.search-bar input{
 width:100%;padding:13px 16px;border-radius:12px;
 border:1px solid #492033;background:#120b12;color:white;font-size:13px;outline:none;
}
.search-bar input:focus{border-color:var(--pink)}
.cat-box{
 background:#120b12;border:1px solid #492033;border-radius:12px;padding:14px;margin-bottom:24px;
}
.cat-box h3{margin:0 0 12px;font-size:14px;color:var(--pink)}
.filters{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.filter{
 padding:9px 14px;border-radius:8px;border:1px solid #452033;
 background:#180f18;color:#d8c1cc;font-size:12px;font-weight:700;
}
.filter.active,.filter:hover{
 background:linear-gradient(135deg,#c50043,#72001f);color:white;border-color:#ff5b8d;
}

/* ركن القراءة */
.reading-corner{
 text-align:center;padding:24px 16px 32px;margin:24px 0;
 background:linear-gradient(180deg,rgba(27,12,23,.55),rgba(18,11,18,.35));
 border:1px solid #492033;border-radius:16px;
}
.reading-corner h2{margin:0 0 6px;color:var(--pink);font-size:22px}
.reading-corner p{margin:0 0 18px;color:var(--muted);font-size:13px}
.mascot{
 width:100%;
 max-width:620px;
 height:auto;
 max-height:520px;
 object-fit:contain;
 border-radius:14px;
 margin:0 auto;
 display:block;
 filter:drop-shadow(0 0 18px #b0003a44);
}
.desktop-mascot{
 display:none;width:100%;max-width:620px;max-height:520px;
 object-fit:contain;margin:12px auto 0;border-radius:14px;
 filter:drop-shadow(0 0 22px #b0003a66);
}
@media(min-width:701px){
 .desktop-mascot.has-custom{display:block}
}
.mascot.custom-mascot{object-fit:contain}

/* ماكي العائمة */
#floatingMaki{
 position:fixed;
 left:18px;
 bottom:12px;
 z-index:25;
 width:165px;
 display:flex;
 flex-direction:column;
 align-items:center;
 pointer-events:none;
}
#floatingMakiImage{
 width:155px;
 height:190px;
 object-fit:contain;
 display:block;
 filter:drop-shadow(0 0 15px #b0003a66);
}
.maki-bubble{
 position:relative;
 background:linear-gradient(135deg,#260d1c,#100811);
 border:1px solid #ef1b58;
 color:#ffe6ef;
 border-radius:14px;
 padding:8px 13px;
 font-size:12px;
 font-weight:800;
 white-space:nowrap;
 box-shadow:0 0 15px #b0003a55;
 margin-bottom:4px;
}

/* الأقسام والكروت */
.section{margin:28px 0 36px}
.section-title{
 display:flex;justify-content:space-between;align-items:center;
 border-right:4px solid var(--bright);padding-right:10px;margin-bottom:14px;
}
.section-title h2{margin:0;font-size:18px}
.section-title small{color:var(--muted);font-size:11px}

.chapter-list{display:grid;gap:9px}
.chapter-item,.notification{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:12px 14px;background:#140c14;
 border:1px solid #452033;border-radius:9px;font-size:12px;
}
.notification.unread{border-color:var(--bright);background:#1f0d19}

.feature-box{
 background:linear-gradient(135deg,#1b0d18,#0e090f);
 border:1px solid #512338;border-radius:14px;padding:18px;margin-bottom:28px;
}
.feature-box h3{margin:0 0 14px;color:var(--pink);font-size:17px}
.feature-empty{text-align:center;padding:24px;color:var(--muted);font-size:12px;grid-column:1/-1}

.manga-grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;
}
.manga-card{
 background:#130b13;border:1px solid #492033;border-radius:12px;
 overflow:hidden;display:flex;flex-direction:column;transition:.25s;cursor:pointer;
}
.manga-card:hover{transform:translateY(-4px);border-color:var(--bright);box-shadow:0 8px 24px #b0003a33}
.cover{width:100%;height:260px;object-fit:cover;background:#1d101b;display:block}
.card-info{padding:12px;display:flex;flex-direction:column;flex:1}
.card-info h3{margin:0 0 6px;font-size:15px;color:white}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:10px;padding:2px 8px;border-radius:6px;background:#291120;color:#ff8fb1;border:1px solid #59263d}
.card-info p{
 font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.6;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-actions{margin-top:auto;display:flex;gap:5px;flex-wrap:wrap}
.card-actions button{flex:1;padding:6px 4px;font-size:10px}

/* صفحة تفاصيل المانهوا وقائمة الفصول */
.details-box{
 display:none;background:linear-gradient(135deg,#1b0d18,#0e090f);
 border:1px solid #59263d;border-radius:16px;padding:22px;margin:20px 0;
}
.details-header{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:20px}
.details-cover{width:220px;height:310px;object-fit:cover;border-radius:12px;border:1px solid #59263d}
.details-meta{flex:1;min-width:250px}
.details-meta h2{margin:0 0 10px;font-size:24px;color:white}
.details-meta p{color:#d8c1cc;font-size:13px;line-height:1.8}
.chapters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px}
.ch-num-btn{
 padding:12px;background:#140c14;border:1px solid #492033;border-radius:10px;
 color:white;font-weight:700;font-size:13px;text-align:center;transition:.2s;
}
.ch-num-btn:hover{background:linear-gradient(135deg,#c50043,#72001f);border-color:#ff5b8d}

/* القارئ المتصل */
.reader{
 display:none;margin:20px 0;padding:18px;
 border:1px solid #512338;border-radius:12px;
 background:#100a11;text-align:center;
}
.reader.show{display:block}
.reader-nav{
 display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
 gap:10px;padding:12px;background:#150c15;border:1px solid #492033;border-radius:10px;margin:10px 0;
}
#readerImages{
 max-width:850px;margin:14px auto;
 display:flex;flex-direction:column;gap:0!important;padding:0!important;
 background:#000;border-radius:8px;overflow:hidden;
}
#readerImages img{
 display:block!important;width:100%!important;height:auto!important;
 margin:0!important;padding:0!important;border:none!important;
}

/* الإدارة */
.about-box,.panel{
 background:linear-gradient(135deg,#1b0d18,#0e090f);
 border:1px solid #512338;border-radius:12px;padding:20px;
 line-height:2;
}
.panel{margin-top:15px}
.panel h3{color:var(--pink);font-size:15px}
.panel[hidden]{display:none!important}
.admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;border-bottom:1px solid #492033;padding-bottom:12px}
.admin-tab{
 padding:9px 16px;border-radius:9px;border:1px solid #492033;
 background:#140c14;color:#d8c1cc;font-weight:700;font-size:12px;
}
.admin-tab.active{background:linear-gradient(135deg,#c50043,#72001f);color:white;border-color:#ff5b8d}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{
 width:100%;padding:11px 13px;margin:6px 0;
 border:1px solid #512338;border-radius:8px;
يُرجى استخدام الرمز البرمجي بحذر.
background:#100a11;color:white;outline:none;font-size:12px;
}
.field:focus{border-color:var(--pink)}
.field option{background:#170d16}
.admin-list{display:grid;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto}
.admin-row{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:10px;background:#100a11;
border:1px solid #452033;border-radius:8px;font-size:12px;
}
.stitch-box{
background:#150b14;border:1px dashed #ef1b58;border-radius:10px;padding:12px;margin:8px 0;
}
.tiny{font-size:10px;color:#bda7b2;display:block}
.status{font-size:12px;color:#ff9ab6;min-height:22px}
hr{border:0;border-top:1px solid #492033;margin:22px 0}
/* مركز الصور */
.image-manager{margin-top:12px}
.image-manager-intro{font-size:12px;color:var(--muted);margin-bottom:14px}
.image-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.image-slot{background:#120a12;border:1px solid #452033;border-radius:12px;padding:14px}
.image-slot h4{margin:0 0 8px;color:var(--pink);font-size:13px}
.image-preview{
height:110px;background:#0a060a;border:1px solid #381828;border-radius:8px;
display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;font-size:11px;color:var(--muted);
}
.image-preview img{width:100%;height:100%;object-fit:contain}
.image-slot-actions{display:flex;gap:6px;margin-top:6px}
.image-slot-actions button{flex:1;padding:7px;font-size:11px}
.image-status{font-size:11px;color:#ff9ab6;margin-top:6px}
/* الفوتر */
footer{
text-align:center;padding:34px 20px;margin-top:40px;
border-top:1px solid var(--line);background:#0c070d;
}
footer.custom-footer{
background-image:linear-gradient(#080609bb,#080609e8),var(--custom-footer-image);
background-size:cover;background-position:center;
}
footer .logo{justify-content:center;margin-bottom:8px}
footer p{margin:4px 0;font-size:12px;color:var(--muted)}
/* النوافذ المنبثقة */
.modal{
display:none;position:fixed;inset:0;z-index:100;
background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex}
.modal-box{
position:relative;width:100%;max-width:400px;
background:#150c15;border:1px solid #59263d;border-radius:14px;padding:22px;
}
.close-btn{
position:absolute;left:14px;top:12px;background:none;border:none;color:var(--pink);font-size:22px;
}
.account-tools{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:12px}
/* الهاتف */
@media(max-width:700px){
.topbar{justify-content:center;padding:10px 12px}
.logo{font-size:19px}
nav{justify-content:center;gap:6px}
nav a,.nav-button{font-size:10px;padding:7px 9px}
.hero{padding:0;margin:12px 12px 20px}
.hero-frame{min-height:275px;background-position:38% center}
.hero-content{right:4%;bottom:15px;max-width:70%}
.hero h1{font-size:25px}
.hero p{font-size:10px}
main{padding:0 12px 40px}
.section{margin:22px 0 30px}
.section-title h2{font-size:15px}
.filters{justify-content:flex-start}
.filter{min-width:16.6%;font-size:10px;padding:13px 7px}
.reading-corner{padding:12px 5px 18px}
.mascot{max-width:100%;max-height:420px}
.desktop-mascot{display:none!important}
#floatingMaki{width:110px;left:8px;bottom:8px}
#floatingMakiImage{width:100px;height:120px}
.maki-bubble{font-size:9px;padding:5px 8px}
.manga-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cover{height:190px}
.card-info{padding:9px}
.card-info h3{font-size:12px}
.card-info p{font-size:10px}
.card-actions button{font-size:9px;padding:6px}
.admin-grid{grid-template-columns:1fr}
.admin-row{align-items:flex-start;flex-direction:column}
.chapter-item{font-size:10px}
.image-slots{grid-template-columns:1fr}
.details-cover{width:100%;height:260px}
}

}[c]));
let currentUser=null;
let manga=[];
let chapters=[];

function isAdmin(){
return !!currentUser;
}
function status(id,msg){
const el=$(id);
if(el)el.textContent=msg;
}
function openAccount(){$('accountModal').classList.add('open');}
function closeAccount(){$('accountModal').classList.remove('open');}
function showMainView(){
$('mainContent').style.display='block';
$('mangaDetailsBox').style.display='none';
$('reader').classList.remove('show');
$('management').hidden=true;
}
function openAdminPanel(){
if(!isAdmin()){openAccount();return;}
$('mainContent').style.display='none';
$('mangaDetailsBox').style.display='none';

async function mergeImagesVertically(files){
const loadedImgs=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{
const img=new Image();
const url=URL.createObjectURL(file);
img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};
img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('فشل تحميل إحدى الصور للدمج'));};
img.src=url;
})));
if(loadedImgs.length===1)return files[0];
const targetWidth=loadedImgs[0].naturalWidth;
let totalHeight=0;
const scaledHeights=loadedImgs.map(img=>{
const ratio=targetWidth/img.naturalWidth;
const h=Math.round(img.naturalHeight*ratio);
totalHeight+=h;
return h;
});
const canvas=document.createElement('canvas');
canvas.width=targetWidth;
canvas.height=totalHeight;
const ctx=canvas.getContext('2d');
let currentY=0;
loadedImgs.forEach((img,idx)=>{
const h=scaledHeights[idx];
ctx.drawImage(img,0,currentY,targetWidth,h);
currentY+=h;
});
return new Promise((resolve,reject)=>{
canvas.toBlob(blob=>{
if(!blob)return reject(new Error('تعذر إنشاء الصورة المدمجة'));
resolve(new File([blob],merged_${Date.now()}.webp,{type:'image/webp'}));
},'image/webp',0.94);
});
}

}

footer.style.setProperty('--custom-footer-image',url("${imageSettings.footer}"));
footer.classList.add('custom-footer');
}else if(footer){
footer.classList.remove('custom-footer');
}
updateImagePreviews();
}
async function installSiteImage(key){
if(!isAdmin()){
status('adminStatus','ما عندج صلاحية الإدارة.');
return;
}
const input=$('file-'+key);
const file=input?.files?.[0];
if(!file){
$('status-'+key).textContent='اختاري صورة من جهازج أولاً.';
return;
}
if(!file.type.startsWith('image/')){
$('status-'+key).textContent='الملف المختار مو صورة.';
return;
}
$('status-'+key).textContent='جاري رفع الصورة...';
try{
const url=await uploadFile(file);
imageSettings[key]=url;
localStorage.setItem(IMAGE_SETTINGS_KEY,JSON.stringify(imageSettings));
applyImageSettings();
input.value='';
$('status-'+key).textContent='تم تركيب الصورة بنجاح.';
}catch(error){
$('status-'+key).textContent='تعذر رفع الصورة: '+error.message;
}
}
function resetSiteImage(key){
if(!isAdmin()){
status('adminStatus','ما عندج صلاحية الإدارة.');
return;
}
delete imageSettings[key];
localStorage.setItem(IMAGE_SETTINGS_KEY,JSON.stringify(imageSettings));
applyImageSettings();
const input=$('file-'+key);
if(input)input.value='';
$('status-'+key).textContent='رجعت الصورة الافتراضية.';
}
document.querySelectorAll('[data-install-image]').forEach(button=>{

document.querySelectorAll('[data-reset-image]').forEach(button=>{
button.addEventListener('click',()=>resetSiteImage(button.dataset.resetImage));
});
